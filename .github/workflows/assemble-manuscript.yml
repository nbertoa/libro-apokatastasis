name: Assemble manuscript files

on:
  push:
    branches:
      - setup/manuscrito-inicial
    paths:
      - .assemble

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: setup/manuscrito-inicial

      - name: Assemble canonical files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p manuscrito skills/escritura-pregunta-respuesta

          : > /tmp/cap3-source.md
          for f in .parts-text/ch3/*.part; do
            cat "$f" >> /tmp/cap3-source.md
            if [ "$f" != ".parts-text/ch3/004.part" ]; then printf '\n' >> /tmp/cap3-source.md; fi
          done
          echo "e57820a7334ba69502baeb4a09adf182f6bce3097c89604a8c9972516a9b0fe6  /tmp/cap3-source.md" | sha256sum -c -
          cp /tmp/cap3-source.md manuscrito/03_hasta_donde_llega_la_esperanza_del_antiguo_testamento.md

          : > /tmp/cap6-source.md
          for f in .parts-text/ch6/*.part; do
            cat "$f" >> /tmp/cap6-source.md
            if [ "$f" != ".parts-text/ch6/004.part" ]; then printf '\n' >> /tmp/cap6-source.md; fi
          done
          echo "0801ca6c7da520db7a4ffde90329ddaed2f8d7a70edea4d66f2d9c77caf058cc  /tmp/cap6-source.md" | sha256sum -c -
          cp /tmp/cap6-source.md manuscrito/06_que_dicen_los_demas_escritos_del_nuevo_testamento_sobre_el_destino_final.md

          cp manuscrito/06-hasta-donde-llega-la-victoria-de-cristo-segun-pablo.md /tmp/pablo-source.md
          echo "5e18f2925f19333fca8e2426016a54471d411133402e6b02cf0fdeec8208cddd  /tmp/pablo-source.md" | sha256sum -c -
          cp /tmp/pablo-source.md manuscrito/07_hasta_donde_llega_la_victoria_de_cristo_segun_pablo.md

          python - <<'PY'
          from pathlib import Path
          import re

          ep = Path('manuscrito/06_que_dicen_los_demas_escritos_del_nuevo_testamento_sobre_el_destino_final.md')
          text = ep.read_text(encoding='utf-8')
          intro = '''# Capítulo 6 — ¿Qué dicen los demás escritos del Nuevo Testamento sobre el destino final?\n\n## 1. ¿Por qué escuchar estos escritos antes de llegar a Pablo?\n\nLos Evangelios nos dejaron una tensión real: hablan de juicio, exclusión y destrucción, pero también de un Dios que busca lo perdido y de una misión de Cristo dirigida al mundo entero. Antes de llegar a Pablo conviene escuchar a los demás escritos del Nuevo Testamento por sí mismos. Si la restauración universal es realmente una conclusión sólida, no debería depender de leer primero a Pablo y después hacer que Hebreos, Santiago, Pedro, Judas y Juan encajen con él. Estos escritos pueden confirmar una esperanza amplia, ponerle límites o incluso ofrecer evidencia en contra. **Por eso funcionan como una prueba adversarial independiente: ¿qué ocurre con el caso cuando dejamos que estos autores hablen antes de llegar a las afirmaciones universalistas más fuertes de Pablo?**\n\n'''
          text, n = re.subn(r'\A# Capítulo 7 — Los demás escritos del Nuevo Testamento\n\n## 1\..*?(?=## 2\.)', intro, text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('No se pudo reemplazar la introducción del capítulo 6')
          cierre = '''## 56. ¿Qué dejan establecido estos escritos antes de llegar a Pablo?\n\nHan hecho más difícil cualquier conclusión rápida. **Hebreos** añade juicio *aiōnios*, apostasía sin renovación presentada, fuego y destrucción, aunque también una victoria amplia de Cristo sobre la muerte. **Santiago** cambia poco el balance: insiste en juicio real, misericordia y posibilidad de recuperar al pecador, pero casi no describe el destino final. **Primera Pedro** mantiene abierta, sin resolverla, la posibilidad de una acción salvadora después de la muerte y muestra que «juicio» no significa automáticamente condenación final. **Segunda Pedro** añade destrucción, castigo y una apostasía cuyo estado final puede ser peor que el primero, con muy poco material positivo para una restauración posterior. **Judas** combina destrucción con algunas de las expresiones de duración más fuertes de estas cartas. **Primera Juan**, en cambio, vuelve a ampliar enormemente el horizonte de la obra de Cristo —pecados del mundo entero, Salvador del mundo, destrucción de las obras del diablo—, pero conserva juicio, castigo, muerte y la exigencia de tener al Hijo para poseer la vida. El resultado provisional es una tensión más definida: **el aniquilacionismo recibe el lenguaje más directo de muerte y destrucción; el infernalismo recibe evidencia real de castigo y duración, pero todavía pocas descripciones explícitas de sufrimiento humano consciente sin fin; la restauración universal recibe afirmaciones amplias sobre la misión y victoria de Cristo, pero sigue sin encontrar aquí una secuencia explícita en la que las mismas personas destruidas en el juicio sean después restauradas.** Con esos límites ya sobre la mesa, ahora sí podemos llegar a Pablo y hacer la pregunta decisiva: **¿hasta dónde dice él que llega finalmente la victoria de Cristo?**\n'''
          text, n = re.subn(r'## 56\. ¿Qué han añadido, en conjunto, Hebreos, Santiago, Pedro, Judas y Juan al balance que dejó Pablo\?\n\n.*\Z', cierre, text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('No se pudo reemplazar el cierre del capítulo 6')
          ep.write_text(text, encoding='utf-8')

          pablo = Path('manuscrito/07_hasta_donde_llega_la_victoria_de_cristo_segun_pablo.md')
          ptext = pablo.read_text(encoding='utf-8')
          ptext = re.sub(r'\A# Capítulo 6 —', '# Capítulo 7 —', ptext, count=1)
          pablo.write_text(ptext, encoding='utf-8')
          PY

          cat .parts/skill/*.b64 | base64 --decode | gunzip > skills/escritura-pregunta-respuesta/SKILL.md

          rm -f manuscrito/06-hasta-donde-llega-la-victoria-de-cristo-segun-pablo.md
          rm -f skills/escritura-pregunta-respuesta/README.md

          git config user.name "ChatGPT Project"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manuscrito skills/escritura-pregunta-respuesta
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "manuscrito: completar versiones canónicas y reordenar capítulos"
          git push origin HEAD:setup/manuscrito-inicial
