name: Finalize chapter order

on:
  push:
    branches:
      - setup/estructura-proyecto
    paths:
      - .finalize

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: setup/estructura-proyecto

      - name: Reorder and fix transitions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          ep = Path('capitulos/06_que_dicen_los_demas_escritos_del_nuevo_testamento_sobre_el_destino_final.md')
          text = ep.read_text(encoding='utf-8')

          intro = '''# Capítulo 6 — ¿Qué dicen los demás escritos del Nuevo Testamento sobre el destino final?\n\n## 1. ¿Por qué escuchar estos escritos antes de llegar a Pablo?\n\nLos Evangelios nos dejaron una tensión real: hablan de juicio, exclusión y destrucción, pero también de un Dios que busca lo perdido y de una misión de Cristo dirigida al mundo entero. Antes de llegar a Pablo conviene escuchar a los demás escritos del Nuevo Testamento por sí mismos. Si la restauración universal es realmente una conclusión sólida, no debería depender de leer primero a Pablo y después hacer que Hebreos, Santiago, Pedro, Judas y Juan encajen con él. Estos escritos pueden confirmar una esperanza amplia, ponerle límites o incluso ofrecer evidencia en contra. **Por eso funcionan como una prueba adversarial independiente: ¿qué ocurre con el caso cuando dejamos que estos autores hablen antes de llegar a las afirmaciones universalistas más fuertes de Pablo?**\n\n'''
          text, n = re.subn(r'\A# Capítulo 7 — Los demás escritos del Nuevo Testamento\n\n## 1\..*?(?=## 2\.)', intro, text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('No se pudo actualizar la apertura del capítulo 6')

          text = text.replace(
              'Esto encaja con la imagen que ya encontramos en Pablo de la muerte como un enemigo que Cristo vence, pero Hebreos todavía no dice aquí que cada ser humano participe finalmente de esa liberación.',
              'Esto presenta la muerte como un enemigo cuyo poder Cristo viene a quebrar, pero Hebreos todavía no dice aquí que cada ser humano participe finalmente de esa liberación.'
          )

          text = text.replace(
              'Antes de entrar en Apocalipsis conviene detenernos una vez y preguntar: **¿qué han añadido, en conjunto, Hebreos, Santiago, Pedro, Judas y Juan al balance que dejó Pablo?**',
              'Antes de llegar a Pablo conviene detenernos una vez y preguntar: **¿qué dejan establecido, en conjunto, Hebreos, Santiago, Pedro, Judas y Juan?**'
          )

          cierre = '''## 56. ¿Qué dejan establecido, en conjunto, Hebreos, Santiago, Pedro, Judas y Juan?\n\nHan hecho más difícil cualquier conclusión rápida. **Hebreos** añade juicio *aiōnios*, apostasía sin renovación presentada, fuego y destrucción, aunque también una victoria amplia de Cristo sobre la muerte. **Santiago** cambia poco el balance: insiste en juicio real, misericordia y posibilidad de recuperar al pecador, pero casi no describe el destino final. **Primera Pedro** mantiene abierta, sin resolverla, la posibilidad de una acción salvadora después de la muerte y muestra que «juicio» no significa automáticamente condenación final. **Segunda Pedro** añade destrucción, castigo y una apostasía cuyo estado final puede ser peor que el primero, con muy poco material positivo para una restauración posterior. **Judas** combina destrucción con algunas de las expresiones de duración más fuertes de estas cartas. **Primera Juan**, en cambio, vuelve a ampliar enormemente el horizonte de la obra de Cristo —pecados del mundo entero, Salvador del mundo, destrucción de las obras del diablo—, pero conserva juicio, castigo, muerte y la exigencia de tener al Hijo para poseer la vida. El resultado provisional es una tensión más definida: **el aniquilacionismo recibe el lenguaje más directo de muerte y destrucción; el infernalismo recibe evidencia real de castigo y duración, pero todavía pocas descripciones explícitas de sufrimiento humano consciente sin fin; la restauración universal recibe afirmaciones amplias sobre la misión y victoria de Cristo, pero sigue sin encontrar aquí una secuencia explícita en la que las mismas personas destruidas en el juicio sean después restauradas.** Con esos límites ya sobre la mesa, ahora sí podemos llegar a Pablo y hacer la pregunta decisiva: **¿hasta dónde dice él que llega finalmente la victoria de Cristo?**\n'''
          text, n = re.subn(r'## 56\. ¿Qué han añadido Hebreos, Santiago, Pedro, Judas y Juan al balance que dejó Pablo\?\n\n.*\Z', cierre, text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('No se pudo actualizar el cierre del capítulo 6')
          ep.write_text(text, encoding='utf-8')

          pablo = Path('capitulos/07_hasta_donde_llega_la_victoria_de_cristo_segun_pablo.md')
          ptext = pablo.read_text(encoding='utf-8')
          ptext, n = re.subn(r'\A# Capítulo 6 —', '# Capítulo 7 —', ptext, count=1)
          if n != 1:
              raise SystemExit('No se pudo renumerar el capítulo de Pablo')
          old = 'El siguiente paso es comprobar si Hebreos, Santiago, Pedro, Judas y las cartas de Juan confirman, limitan o contradicen esta esperanza.'
          new = 'La última gran prueba bíblica será Apocalipsis: allí tendremos que preguntar si sus imágenes de juicio, segunda muerte y lago de fuego terminan en una exclusión definitiva o si deben leerse dentro de una nueva creación cuyo alcance todavía tenemos que determinar.'
          if old not in ptext:
              raise SystemExit('No se encontró la transición final de Pablo')
          ptext = ptext.replace(old, new)
          pablo.write_text(ptext, encoding='utf-8')
          PY

          git config user.name "ChatGPT Project"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add capitulos/06_que_dicen_los_demas_escritos_del_nuevo_testamento_sobre_el_destino_final.md capitulos/07_hasta_donde_llega_la_victoria_de_cristo_segun_pablo.md
          git commit -m "manuscrito: ordenar epístolas antes de Pablo y ajustar transiciones"
          git push origin HEAD:setup/estructura-proyecto
